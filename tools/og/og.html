<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Gambar OG v2 "Tanukonomy Matcha": kanvas kabut, cahaya sage, ikon clay. Token dari src/styles/global.css. */
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('../../src/assets/fonts/PlusJakartaSans-Variable.woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Space Mono'; src: url('../../src/assets/fonts/SpaceMono-Bold.woff2'); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #fafaf9; font-family: 'Plus Jakarta Sans'; color: #111827; overflow: hidden;
    background-image: radial-gradient(60% 90% at 88% 30%, #d8e6dc, transparent 70%); }
  .copy { position: absolute; left: 80px; top: 78px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  .brand img { width: 60px; height: 60px; }
  .label { font-family: 'Space Mono'; font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: #1f4b2c; margin-top: 52px; }
  h1 { font-weight: 700; font-size: 68px; line-height: 1.06; letter-spacing: -0.03em; margin-top: 14px; }
  .chips { display: flex; gap: 12px; margin-top: 38px; }
  .chips span { font-family: 'Space Mono'; font-weight: 700; font-size: 18px; padding: 9px 18px; border: 1px solid #eaecef; border-radius: 9999px; background: #fff; color: #111827; }
  .orb { position: absolute; right: 70px; top: 100px; width: 430px; height: 430px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #d8e6dc 78%); border: 1px solid #eaecef; box-shadow: 0 8px 24px -4px rgb(17 24 39 / .08); }
  .orb img { position: absolute; filter: drop-shadow(0 8px 10px rgb(17 24 39 / .18)); }
  .tan { left: 62px; top: 62px; width: 306px; height: 306px; }
  .a { left: 10px; top: 54px; width: 86px; } .b { right: 6px; top: 98px; width: 74px; }
  .c { left: 30px; bottom: 44px; width: 80px; } .d { right: 56px; bottom: 26px; width: 62px; } .e { left: 186px; top: -14px; width: 58px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/clay/tanuki_mascot.svg" alt="" />Tanukonomy</div>
    <div class="label" id="label"></div>
    <h1 id="title"></h1>
    <div class="chips" id="chips"></div>
  </div>
  <div class="orb">
    <img class="tan" src="../../src/assets/clay/tanuki_mascot.svg" alt="" />
    <img class="a" src="../../src/assets/clay/piggy_savings.svg" alt="" />
    <img class="b" src="../../src/assets/clay/cash_wallet.svg" alt="" />
    <img class="c" src="../../src/assets/clay/chart_investment.svg" alt="" />
    <img class="d" src="../../src/assets/clay/tier_coin.svg" alt="" />
    <img class="e" src="../../src/assets/clay/check_completed.svg" alt="" />
  </div>
  <script>
    const copy = {
      id: { label: 'Catatan keuangan pribadi', title: 'Buku kas pribadi yang tetap di ponselmu.', chips: ['Bisa dipakai offline', 'Data di perangkat'] },
      en: { label: 'Personal money tracker', title: 'A personal cash book that stays on your phone.', chips: ['Works offline', 'Data stays on device'] },
    }[new URLSearchParams(location.search).get('lang') || 'id'];
    document.getElementById('label').textContent = copy.label;
    document.getElementById('title').textContent = copy.title;
    document.getElementById('chips').innerHTML = copy.chips.map((c) => `<span>${c}</span>`).join('');
  </script>
</body>
</html>
