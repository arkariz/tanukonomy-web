" height="38" rx="8" stroke-width="1"/><text class="tx" x="117" y="369" font-size="16" font-weight="600" text-anchor="middle">BCA account</text><rect class="t-mu edge" x="268" y="344" width="190" height="38" rx="8" stroke-width="1"/><text class="tx" x="363" y="369" font-size="16" font-weight="600" text-anchor="middle">GoPay</text><line class="ln" x1="216" y1="363" x2="250" y2="363"/><polygon class="ar" points="248,356 262,363 248,370"/><rect class="t-tr edge" x="22" y="396" width="436" height="50" rx="8" stroke-width="1"/><text class="tr" x="38" y="427" font-size="16" font-weight="700" text-anchor="start">Transfer · Rp500,000</text><text class="tr m" x="442" y="427" font-size="15" font-weight="700" text-anchor="end">not counted</text><rect class="t-ex edge" x="22" y="454" width="436" height="50" rx="8" stroke-width="1"/><text class="exp" x="38" y="485" font-size="16" font-weight="700" text-anchor="start">Purchase · Rp500,000</text><text class="exp m" x="442" y="485" font-size="15" font-weight="700" text-anchor="end">−Rp500,000</text><text class="mu" x="22" y="536" font-size="14" font-weight="600" text-anchor="start">Total spending recorded</text><text class="inc m" x="458" y="540" font-size="26" font-weight="700" text-anchor="end">Rp500,000</text></svg>