nt-weight="600" text-anchor="start">Transport</text><rect class="f-ac" x="158" y="222" width="10" height="10"/><text class="tx" x="178" y="232" font-size="17" font-weight="600" text-anchor="start">Phone credit</text><text class="ac" x="158" y="258" font-size="15" font-weight="700" text-anchor="start">Where leaks show up most</text><rect class="sh" x="4" y="290" width="480" height="126" rx="6"/><rect class="card edge" x="0" y="286" width="480" height="126" rx="6" stroke-width="2"/><rect class="t-tr" x="1" y="287" width="140" height="124" rx="5"/><line class="ln" x1="141" y1="287" x2="141" y2="411"/><text class="tx m" x="14" y="320" font-size="14" font-weight="700" text-anchor="start">OCCASIONAL</text><text class="mu" x="14" y="348" font-size="15" font-weight="500" text-anchor="start">Not every</text><text class="mu" x="14" y="368" font-size="15" font-weight="500" text-anchor="start">month</text><rect class="f-ac" x="158" y="310" width="10" height="10"/><text class="tx" x="178" y="320" font-size="17" font-weight="600" text-anchor="start">Vehicle service</text><rect class="f-ac" x="158" y="336" width="10" height="10"/><text class="tx" x="178" y="346" font-size="17" font-weight="600" text-anchor="start">Gifts</text><rect class="f-ac" x="158" y="362" width="10" height="10"/><text class="tx" x="178" y="372" font-size="17" font-weight="600" text-anchor="start">Annual subscription</text><text class="ac" x="158" y="398" font-size="15" font-weight="700" text-anchor="start">Easiest to forget</text></svg>