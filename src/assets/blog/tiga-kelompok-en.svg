<svg xmlns="http://www.w3.org/2000/svg" width="486" height="422" viewBox="0 0 486 422" role="img" aria-labelledby="t d"><title id="t">Three groups of spending</title><desc id="d">Three cards: fixed, variable, and occasional, each with examples.</desc><style>
